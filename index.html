<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Organiza 3D Manager</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f5f7;
}

header{
    background:#0B6E4F;
    color:white;
    padding:25px;
    text-align:center;
}

h1{
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{

    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 4px 10px rgba(0,0,0,.12);

}

.card h2{
    margin-top:0;
    color:#0B6E4F;
}

.numero{

    font-size:32px;
    font-weight:bold;

}

button{

    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0B6E4F;
    color:white;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;

}

button:hover{

background:#0f8a64;

}

footer{

margin-top:40px;
text-align:center;
color:#666;

}

</style>

</head>

<body>

<header>

<h1>Organiza 3D Manager</h1>

<p>Gestão completa da Organiza 3D Home e Kids</p>

</header>

<div class="container">

<div class="cards">

<div class="card">

<h2>💰 Faturamento</h2>

<div class="numero">R$ 0,00</div>

</div>

<div class="card">

<h2>📦 Produtos</h2>

<div class="numero">0</div>

</div>

<div class="card">

<h2>🖨 Impressoras</h2>

<div class="numero">0</div>

</div>

<div class="card">

<h2>🧵 Filamentos</h2>

<div class="numero">0</div>

</div>

<div class="card">

<h2>📋 Encomendas</h2>

<div class="numero">0</div>

</div>

<div class="card">

<h2>📈 Lucro</h2>

<div class="numero">R$ 0,00</div>

</div>

</div>

<button>Começar Cadastro</button>

<footer>

Organiza 3D Manager © 2026

</footer>

</div>

</body>

</html>
